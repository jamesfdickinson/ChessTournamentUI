<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Domain Helper</title>
</head>
<body>
    <script>
        // This script runs in the context of bracketjd.com and can access its localStorage
        console.log('Cross-domain helper loaded on:', window.location.origin);

        // Listen for messages from the parent window
        window.addEventListener('message', function(event) {
            console.log('Received message in iframe:', event.data);
            
            // Verify the message is from a trusted origin (your app's domain)
            // You should replace this with your actual domain
            const trustedOrigins = [
                'http://localhost:8080',
                'http://127.0.0.1:8080',
                'https://localhost:8080',
                'https://127.0.0.1:8080',
                // Add your production domain here
                'https://tournamentjd.com',
                'https://bracketjd.com'
            ];
            
            if (!trustedOrigins.includes(event.origin)) {
                console.warn('Message from untrusted origin:', event.origin);
                return;
            }

            // Handle the request for localStorage data
            if (event.data.action === 'getLocalStorage') {
                const key = event.data.key;
                
                try {
                    // Get the requested localStorage item
                    const value = localStorage.getItem(key);
                    let parsedValue = null;
                    
                    if (value) {
                        try {
                            // Try to parse as JSON
                            parsedValue = JSON.parse(value);
                        } catch (e) {
                            // If not JSON, return as string
                            parsedValue = value;
                        }
                    }
                    
                    // Send the data back to the parent window
                    event.source.postMessage({
                        action: 'localStorageData',
                        key: key,
                        value: parsedValue,
                        success: true
                    }, event.origin);
                    
                    console.log('Sent localStorage data for key:', key, parsedValue);
                    
                } catch (error) {
                    // Send error back to parent window
                    event.source.postMessage({
                        action: 'localStorageData',
                        key: key,
                        value: null,
                        success: false,
                        error: error.message
                    }, event.origin);
                    
                    console.error('Error accessing localStorage:', error);
                }
            }
            
            // Handle setting localStorage data (optional)
            else if (event.data.action === 'setLocalStorage') {
                const key = event.data.key;
                const value = event.data.value;
                
                try {
                    const stringValue = typeof value === 'string' ? value : JSON.stringify(value);
                    localStorage.setItem(key, stringValue);
                    
                    event.source.postMessage({
                        action: 'localStorageSet',
                        key: key,
                        success: true
                    }, event.origin);
                    
                    console.log('Set localStorage data for key:', key);
                    
                } catch (error) {
                    event.source.postMessage({
                        action: 'localStorageSet',
                        key: key,
                        success: false,
                        error: error.message
                    }, event.origin);
                    
                    console.error('Error setting localStorage:', error);
                }
            }
        });

        // Send localStorage data automatically when loaded
        window.addEventListener('load', function() {
            console.log('Helper page loaded, preparing to send localStorage data');
            console.log('Running in popup/iframe context:', window.location.origin);
            console.log('Opener exists:', !!window.opener);
            console.log('Parent is different:', window.parent !== window);
            
            // Check if localStorage is accessible
            try {
                const testAccess = localStorage.length;
                console.log('localStorage is accessible, items count:', testAccess);
                
                // List all localStorage keys for debugging
                console.log('All localStorage keys:');
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    console.log(`  - ${key}`);
                }
            } catch (e) {
                console.error('localStorage is BLOCKED:', e);
            }
            
            // Define trusted origins for security
            const trustedOrigins = [
                'http://localhost:8080',
                'http://127.0.0.1:8080',
                'https://localhost:8080',
                'https://127.0.0.1:8080',
                // Add your production domain here
                'https://tournamentjd.com'
            ];
            
            // Function to send localStorage data
            function sendLocalStorageData(targetWindow, targetOrigin) {
                try {
                    // Get the user data from localStorage
                    console.log('Attempting to access localStorage for user key...');
                    const userValue = localStorage.getItem('user');
                    console.log('Raw localStorage value:', userValue);
                    let parsedUserValue = null;
                    
                    if (userValue) {
                        try {
                            // Try to parse as JSON
                            parsedUserValue = JSON.parse(userValue);
                            console.log('Parsed user value:', parsedUserValue);
                        } catch (e) {
                            // If not JSON, return as string
                            parsedUserValue = userValue;
                            console.log('User value as string:', parsedUserValue);
                        }
                    } else {
                        console.log('No user data found in localStorage');
                    }
                    
                    const message = {
                        action: 'localStorageData',
                        key: 'user',
                        value: parsedUserValue,
                        success: true,
                        autoSent: true  // Flag to indicate this was sent automatically
                    };
                    
                    // Send the data to the target window
                    console.log('Sending message to target window:', message);
                    targetWindow.postMessage(message, targetOrigin);
                    
                    console.log('Successfully sent localStorage user data to', targetOrigin);
                    
                } catch (error) {
                    // Send error to target window
                    const errorMessage = {
                        action: 'localStorageData',
                        key: 'user',
                        value: null,
                        success: false,
                        error: error.message,
                        autoSent: true
                    };
                    
                    console.error('Error auto-sending localStorage:', error);
                    targetWindow.postMessage(errorMessage, targetOrigin);
                }
            }
            
            // Send data after a small delay
            setTimeout(function() {
                // If opened as a popup (has window.opener)
                if (window.opener && window.opener !== window) {
                    console.log('Detected popup context, sending to opener');
                    // Send to each trusted origin via the opener
                    trustedOrigins.forEach(origin => {
                        sendLocalStorageData(window.opener, origin);
                    });
                    // Also try wildcard for compatibility
                    sendLocalStorageData(window.opener, '*');
                }
                // If in an iframe (has different parent)
                else if (window.parent !== window) {
                    console.log('Detected iframe context, sending to parent');
                    // Send to each trusted origin via the parent
                    trustedOrigins.forEach(origin => {
                        sendLocalStorageData(window.parent, origin);
                    });
                    // Also try wildcard for compatibility
                    sendLocalStorageData(window.parent, '*');
                } else {
                    console.log('Not in popup or iframe context, nothing to do');
                }
            }, 100); // Small delay to ensure parent/opener is ready
        });
    </script>
</body>
</html>
