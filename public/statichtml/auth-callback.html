<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating...</title>
</head>

<body>
    <div class="container">
        <h2>Redirecting...</h2>
        <div class="spinner"></div>
        <p id="status">Please wait while we complete your authentication.</p>
        <p><a href="#" onclick="window.history.back(); return false;">Click here to return to Tournament JD</a></p>
    </div>

    <script>
        // This page extracts the user token from localStorage and redirects back to the returnUrl

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function redirectWithToken() {
            try {
                // Get the returnUrl from query parameters
                const returnUrl = getQueryParam('returnUrl');
                const redirect = getQueryParam('redirect');

                if (!returnUrl) {
                    console.error('Error: No return URL specified.');
                    return;
                }

                // Get user data from localStorage
                let userDataString = localStorage.getItem('user');
                if (userDataString) {
                    const userData = JSON.parse(userDataString);
                    //extract token, username, avatar, name
                    const userdata = {
                        token: userData.token,
                        email: userData.email || '',
                        userName: userData.userName || '',
                        avatar: userData.avatar || '',
                        name: userData.name || '',
                        gamerId: userData.gamerId || '',
                        timeZone: userData.timeZone || ''
                    }
                    userDataString = JSON.stringify(userdata);
                }


                // Build the callback URL with all user data
                const separator = returnUrl.includes('?') ? '&' : '?';
                let callbackUrl = returnUrl + separator + 'userdata=' + encodeURIComponent(userDataString);

                if (redirect) {
                    callbackUrl += '&redirect=' + encodeURIComponent(redirect);
                }

                console.log('Redirecting to:', callbackUrl);

                // Redirect to the callback URL
                window.location.href = callbackUrl;

            } catch (error) {
                console.error('Redirect error:', error);
            }
        }
        //check for parameter delay
        const delay = getQueryParam('delay');
        if (delay) {
            setTimeout(redirectWithToken, parseInt(delay));
        } else {
            redirectWithToken();
        }

    </script>
</body>

</html>
