name: Build and deploy to Azure Web App - TournamentJD

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: tournamentjd-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static app
        run: npm run build
        env:
          VUE_APP_API_URL: ${{ vars.VUE_APP_API_URL || 'https://bracketjd-api.azurewebsites.net/' }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: tournamentjd
          slot-name: Production
          package: ./www
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
